server:
  port: 8081

spring:
  application:
    name: game-engine-service
  profiles:
    # The in-memory store keeps the service runnable with no infrastructure.
    default: in-memory

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
